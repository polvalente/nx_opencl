# Cross-compilation targets.
#
# Cargo takes the linker from the CARGO_TARGET_<TRIPLE>_LINKER env var, or
# from the [target.<triple>.linker] setting here.
#
# Under Nerves, `NxCL.Native` sets that env var from the CC of the target
# toolchain, so it wins over this file. The values below apply to manual
# cross-compilation outside Nerves.

[target.aarch64-unknown-linux-gnu]
linker = "aarch64-linux-gnu-gcc"

[target.aarch64-unknown-linux-musl]
linker = "aarch64-linux-musl-gcc"

[target.armv7-unknown-linux-gnueabihf]
linker = "arm-linux-gnueabihf-gcc"

[target.armv7-unknown-linux-musleabihf]
linker = "arm-linux-musleabihf-gcc"
